<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sara ❤️</title>

<style>
body {
margin: 0;
height: 100vh;
overflow: hidden;
font-family: 'Comic Sans MS', cursive;
background: linear-gradient(135deg, #ff6a88, #ff99ac);
display: flex;
justify-content: center;
align-items: center;
text-align: center;
position: relative;
}

.container {
background: white;
padding: 50px;
border-radius: 30px;
box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

h1 {
font-size: 30px;
color: #ff2e63;
}

button {
border: none;
border-radius: 20px;
cursor: pointer;
transition: 0.2s;
}

/* YES big */
#yes {
font-size: 35px;
padding: 25px 60px;
background-color: #ff2e63;
color: white;
}

/* NO tiny and running */
#no {
font-size: 12px;
padding: 5px 10px;
background-color: #aaa;
position: absolute;
}

.footer {
position: absolute;
bottom: 20px;
width: 100%;
font-size: 16px;
color: white;
font-weight: bold;
}

.message {
margin-top: 25px;
font-size: 24px;
color: #ff2e63;
font-weight: bold;
}

.heart {
position: absolute;
color: red;
font-size: 25px;
animation: fall 4s linear infinite;
}

@keyframes fall {
0% { transform: translateY(-10vh); opacity: 1; }
100% { transform: translateY(110vh); opacity: 0; }
}
</style>
</head>
<body>

<div class="container">
<h1>Sara, will you be my Valentine? 😏❤️</h1>
<button id="yes">YES 💖</button>
<button id="no">no 😅</button>
<div class="message" id="message"></div> <!-- پیام اضافه شد -->
</div>

<div class="footer">
😈 Dare to press No… I’ll come steal you myself!
</div>

<!-- 🎵 music (plays ONLY after YES) -->
<audio id="song" src="song.mp3"></audio>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const song = document.getElementById("song");
const message = document.getElementById("message");

// NO runs away
noBtn.addEventListener("mouseover", () => {
const x = Math.random() * (window.innerWidth - 50);
const y = Math.random() * (window.innerHeight - 50);
noBtn.style.left = x + "px";
noBtn.style.top = y + "px";
});

// YES clicked → play music & show message
yesBtn.addEventListener("click", () => {

// play song
song.play();

// create falling hearts
for (let i = 0; i < 40; i++) {
let heart = document.createElement("div");
heart.className = "heart";
heart.innerHTML = "❤️";
heart.style.left = Math.random() * 100 + "vw";
heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
document.body.appendChild(heart);
}

// show message
message.innerHTML = "Yaaay! I know it 😍❤️";

});
</script>

</body>
</html>
